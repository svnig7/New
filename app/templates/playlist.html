<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ name }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="card">
    <h1>&#128220; {{ name }}</h1>
    <div class="meta">{{ items|length }} item{{ "s" if items|length != 1 else "" }}</div>

    {% for item in items %}
    <a class="list-item" href="{{ item.watch_url }}">
      <div>
        <div class="name">{{ item.name }}</div>
        <div class="sub">{{ (item.size / 1048576) | round(1) }} MB &middot; {{ item.mime }}</div>
      </div>
    </a>
    {% else %}
    <p>Nothing in this playlist yet.</p>
    {% endfor %}
  </div>
</body>
</html>
